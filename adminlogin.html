<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login — ProLoveHub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f0f2;
            padding: 20px;
        }
        .login-wrapper {
            display: flex;
            max-width: 900px;
            width: 100%;
            min-height: 500px;
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 40px 80px rgba(26, 20, 35, 0.12);
            overflow: hidden;
        }
        .login-brand {
            flex: 1;
            padding: 48px 40px;
            background: linear-gradient(145deg, #1A1423 0%, #2D2840 50%, #3A2A4A 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: #fff;
            position: relative;
            overflow: hidden;
        }
        .login-brand::before {
            content: '❤';
            position: absolute;
            font-size: 250px;
            opacity: 0.04;
            top: -40px;
            right: -40px;
            font-family: 'Georgia', serif;
            pointer-events: none;
        }
        .login-brand .logo {
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }
        .login-brand .logo .icon {
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #D4A54A;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .login-brand .logo .brand {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .login-brand .logo .brand .pro {
            color: #FFB6C1;
        }
        .login-brand .logo .brand .love {
            color: #fff;
        }
        .login-brand .logo .brand .hub {
            color: #D4A54A;
        }
        .login-brand .tagline {
            font-size: 14px;
            opacity: 0.6;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            margin-top: 4px;
        }
        .login-brand h1 {
            font-size: 36px;
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 16px;
            position: relative;
            z-index: 2;
        }
        .login-brand h1 .gold {
            color: #D4A54A;
        }
        .login-brand p {
            font-size: 16px;
            opacity: 0.7;
            line-height: 1.7;
            max-width: 360px;
            position: relative;
            z-index: 2;
        }
        .login-form-panel {
            flex: 1;
            padding: 48px 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #fff;
        }
        .login-form-panel .admin-shield {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .login-form-panel .admin-shield .shield-icon {
            width: 72px;
            height: 72px;
            background: #F8E8EE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #C2185B;
            border: 4px solid #fff;
            box-shadow: 0 4px 20px rgba(194, 24, 91, 0.1);
        }
        .login-form-panel h2 {
            font-size: 28px;
            font-weight: 800;
            text-align: center;
            color: #1A1423;
            margin-bottom: 4px;
        }
        .login-form-panel h2 .highlight {
            color: #C2185B;
        }
        .login-form-panel .subtitle {
            text-align: center;
            color: #6B6570;
            font-size: 15px;
            margin-bottom: 28px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #2D2A2E;
            margin-bottom: 6px;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9A94A3;
            font-size: 16px;
        }
        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            background: #FAF9FB;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .input-wrapper input:focus {
            border-color: #C2185B;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(194, 24, 91, 0.06);
        }
        .btn-primary {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(135deg, #C2185B, #E85D8A);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 30px rgba(194, 24, 91, 0.3);
            margin-top: 8px;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(194, 24, 91, 0.4);
        }
        .error-message {
            background: #FFEBEE;
            color: #C62828;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-message.show {
            display: flex;
        }
        .demo-text {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #9A94A3;
        }
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-top: 16px;
            font-size: 12px;
            color: #9A94A3;
        }
        .security-badge i {
            color: #4CAF50;
            font-size: 14px;
        }
        @media (max-width: 768px) {
            .login-wrapper {
                flex-direction: column;
                max-width: 440px;
                border-radius: 24px;
            }
            .login-brand {
                padding: 32px 28px;
                min-height: 200px;
            }
            .login-brand h1 {
                font-size: 28px;
            }
            .login-form-panel {
                padding: 32px 28px;
            }
        }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="login-brand">
            <div class="logo">
                <div class="icon"><i class="fas fa-heart"></i></div>
                <div>
                    <span class="brand">
                        <span class="pro">Pro</span><span class="love">Love</span><span class="hub">Hub</span>
                    </span>
                    <div class="tagline">Premium Matchmaking</div>
                </div>
            </div>
            <h1>Admin <span class="gold">Access</span></h1>
            <p>Secure entry to manage members and oversee platform activity.</p>
        </div>

        <div class="login-form-panel">
            <div class="admin-shield">
                <div class="shield-icon"><i class="fas fa-shield-alt"></i></div>
            </div>
            <h2>Admin <span class="highlight">Login</span></h2>
            <p class="subtitle">Enter your credentials to access the dashboard.</p>

            <form id="adminLoginForm">
                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText">Invalid email or password.</span>
                </div>

                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="admin@prolovehub.com" required autofocus />
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPassword" placeholder="••••••••" required />
                    </div>
                </div>

                <button type="submit" class="btn-primary"><i class="fas fa-arrow-right-to-bracket"></i> Log In</button>

                <div class="security-badge">
                    <i class="fas fa-shield-halved"></i> Secure &amp; encrypted connection
                </div>
                <div class="demo-text">Demo: <strong>admin@prolovehub.com</strong></div>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const SUPABASE_URL = 'https://precvldulohwudpfmzsn.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByZWN2bGR1bG9od3VkcGZtenNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDMwNzUsImV4cCI6MjEwMjU3OTA3NX0.BYpgOVlLG1cw5pdYfjrhI_bP615ALKCr1tb9U5Ooc0c';
            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

            const form = document.getElementById('adminLoginForm');
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            form.addEventListener('submit', async function(e) {
                e.preventDefault();
                errorDiv.classList.remove('show');

                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value.trim();

                if (!email || !password) {
                    errorText.textContent = 'Please fill in all fields.';
                    errorDiv.classList.add('show');
                    return;
                }

                try {
                    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
                    if (error) {
                        errorText.textContent = error.message.includes('Invalid login credentials') ? 'Invalid email or password.' : error.message;
                        errorDiv.classList.add('show');
                        return;
                    }

                    const { data: member } = await supabaseClient
                        .from('members')
                        .select('source')
                        .eq('id', data.user.id)
                        .single();

                    if (member && member.source === 'admin') {
                        localStorage.setItem('isAdminLoggedIn', 'true');
                        // ✅ FIXED: Redirect to adminpanel.html (no hyphen)
                        window.location.href = 'adminpanel.html';
                    } else {
                        errorText.textContent = 'Access denied. You are not an admin.';
                        errorDiv.classList.add('show');
                        await supabaseClient.auth.signOut();
                    }
                } catch (err) {
                    errorText.textContent = 'Something went wrong. Please try again.';
                    errorDiv.classList.add('show');
                    console.error(err);
                }
            });
        });
    </script>

</body>
</html>
