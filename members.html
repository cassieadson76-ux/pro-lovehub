<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Members — ProLoveHub</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Inter',sans-serif;
      background:#FAF9FB;
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }
    .container { max-width:1200px; margin:0 auto; padding:24px; flex:1; }
    .header {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:16px 0 20px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      margin-bottom:32px;
    }
    .header .logo {
      font-family:'Playfair Display',serif;
      font-size:28px;
      font-weight:800;
    }
    .header .logo .pro { color:#C2185B; }
    .header .logo .love { color:#1A1423; }
    .header .logo .hub { color:#D4A54A; }
    .header .logout-btn {
      padding:10px 24px;
      border:1px solid rgba(0,0,0,0.08);
      border-radius:50px;
      background:#fff;
      cursor:pointer;
      font-weight:600;
      font-size:14px;
      transition:0.3s;
      display:inline-flex;
      align-items:center;
      gap:8px;
    }
    .header .logout-btn:hover {
      border-color:#C2185B;
      color:#C2185B;
      box-shadow:0 4px 12px rgba(194,24,91,0.1);
    }
    .page-title {
      font-size:32px;
      font-weight:800;
      margin-bottom:4px;
    }
    .page-sub {
      color:#6B6570;
      margin-bottom:24px;
    }
    .members-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
      gap:20px;
    }
    .member-card {
      background:#fff;
      border-radius:16px;
      padding:24px;
      box-shadow:0 4px 20px rgba(26,20,35,0.06);
      border:1px solid rgba(0,0,0,0.04);
      transition:0.3s;
    }
    .member-card:hover { transform:translateY(-4px); box-shadow:0 8px 30px rgba(26,20,35,0.08); }
    .member-card .avatar {
      width:64px; height:64px; border-radius:50%;
      display:flex; align-items:center; justify-content:center;
      font-size:24px; font-weight:700; color:#fff;
      margin-bottom:12px;
    }
    .member-card .name { font-size:18px; font-weight:700; }
    .member-card .email { font-size:14px; color:#6B6570; }
    .member-card .status {
      display:inline-block; padding:4px 14px; border-radius:50px;
      font-size:12px; font-weight:600; margin-top:8px;
    }
    .member-card .status.active { background:#E8F5E9; color:#2E7D32; }
    .member-card .status.pending { background:#FFF3E0; color:#E65100; }
    .member-card .status.rejected { background:#FFEBEE; color:#C62828; }
    .loading, .empty {
      text-align:center; padding:60px 20px; color:#9A94A3;
    }
    .loading i, .empty i { font-size:48px; color:#F8E8EE; margin-bottom:16px; display:block; }
    @media (max-width:768px) { .members-grid { grid-template-columns:1fr 1fr; } }
    @media (max-width:480px) { .members-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo"><span class="pro">Pro</span><span class="love">Love</span><span class="hub">Hub</span></div>
      <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <h1 class="page-title">Members</h1>
    <p class="page-sub">Browse through our community of singles.</p>

    <div id="membersGrid" class="members-grid">
      <div class="loading"><i class="fas fa-spinner fa-spin"></i>Loading members...</div>
    </div>
  </div>

  <!-- Load Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    const SUPABASE_URL = 'https://precvldulohwudpfmzsn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InByZWN2bGR1bG9od3VkcGZtenNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwMDMwNzUsImV4cCI6MjEwMjU3OTA3NX0.BYpgOVlLG1cw5pdYfjrhI_bP615ALKCr1tb9U5Ooc0c';
    const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Check if user is logged in
    async function checkAuth() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        window.location.href = 'loginpage.html';
        return false;
      }
      return true;
    }

    // Load members
    async function loadMembers() {
      const grid = document.getElementById('membersGrid');
      const { data, error } = await supabase
        .from('members')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        grid.innerHTML = `<div class="empty"><i class="fas fa-exclamation-triangle"></i><p>Error: ${error.message}</p></div>`;
        return;
      }
      if (!data || data.length === 0) {
        grid.innerHTML = `<div class="empty"><i class="fas fa-users-slash"></i><p>No members yet. Be the first to join!</p></div>`;
        return;
      }

      const colors = ['#C2185B', '#D4A54A', '#4CAF50', '#7B1FA2', '#00695C', '#E65100'];
      grid.innerHTML = data.map((m, i) => {
        const initials = m.name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
        const color = colors[i % colors.length];
        return `
          <div class="member-card">
            <div class="avatar" style="background:${color};">${initials}</div>
            <div class="name">${m.name}</div>
            <div class="email">${m.email}</div>
            <span class="status ${m.status || 'pending'}">${m.status || 'pending'}</span>
          </div>
        `;
      }).join('');
    }

    // Logout
    document.getElementById('logoutBtn').addEventListener('click', async function() {
      if (confirm('Logout?')) {
        await supabase.auth.signOut();
        localStorage.removeItem('isAdminLoggedIn');
        window.location.href = 'index.html';
      }
    });

    // Init
    (async function() {
      const loggedIn = await checkAuth();
      if (loggedIn) {
        loadMembers();
      }
    })();
  </script>
</body>
</html>
